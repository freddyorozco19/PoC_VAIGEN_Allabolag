[package]
name = "siffra-rs"
version = "0.1.0"
edition = "2021"
description = "Réplica en Rust (Axum + maud) del scaffold Next.js de Siffra. Datos de EJEMPLO; medianas del sector reales desde SCB."
publish = false

[dependencies]
axum = "0.7"
maud = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
argon2 = "0.5"
getrandom = "0.2"
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
