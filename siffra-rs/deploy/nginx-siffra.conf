# Siffra (Rust) — siffra.architechia.co. El acceso lo controla la propia aplicación (cuentas con roles);
# nginx solo termina HTTPS, limita el ritmo y evita la indexación.
# Instalado en /etc/nginx/sites-available/siffra (+ enlace en sites-enabled).
limit_req_zone $binary_remote_addr zone=siffra:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=siffra_login:10m rate=30r/m;

server {
    listen 80;
    server_name siffra.architechia.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl; # managed by Certbot
    server_name siffra.architechia.co;

    ssl_certificate /etc/letsencrypt/live/siffra.architechia.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/siffra.architechia.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    # El formulario de acceso: ritmo más estricto además del límite de intentos de la aplicación.
    location = /login {
        limit_req zone=siffra_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=siffra burst=30 nodelay;
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # La aplicación solo confía en X-Real-IP; se pisa X-Forwarded-For para que nadie falsee su IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
